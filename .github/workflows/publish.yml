name: Publish npm packages

on:
  push:
    tags:
      - 'v*.*.*-alpha.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-rc.*'
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          registry-url: 'https://registry.npmjs.org'

      - name: Compute version and npm dist-tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v*-alpha.* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v*-beta.* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v*-rc.* ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync package.json version with the Git tag
        run: |
          echo "Setting package version to ${{ steps.version.outputs.version }}"
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish @palisadeinc/embedded-wallets-sdk
        run: npm publish --tag ${{ steps.version.outputs.tag }} --provenance

      - name: Sync bridge package version and dependency
        run: |
          cd bridge
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version
          npm pkg set 'dependencies.@palisadeinc/embedded-wallets-sdk=^${{ steps.version.outputs.version }}'

      - name: Publish bridge @palisadeinc/identity-sdk
        run: |
          cd bridge
          npm publish --tag ${{ steps.version.outputs.tag }} --provenance
